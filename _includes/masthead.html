{% include base_path %}
<div class="masthead"><div class="masthead__inner-wrap"><div class="masthead__menu"><nav id="site-nav" class="greedy-nav">
<button aria-label="Open navigation"><span class="navicon"></span></button>
<ul class="visible-links"><li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></li>
{% for link in site.data.navigation.main %}{% unless link.divider %}<li class="masthead__menu-item"><a href="{% if link.url %}{% include portfolio-resource-url.html url=link.url %}{% else %}{{ '/' | relative_url }}#{{ link.section }}{% endif %}">{{ link.title | escape }}</a></li>{% endunless %}{% endfor %}
<li class="masthead__menu-item"><a href="{{ '/year-archive/' | relative_url }}">Blog</a></li><li class="masthead__menu-item"><a href="{{ '/cv/' | relative_url }}">CV</a></li>
<li id="theme-toggle" class="masthead__menu-item persist tail"><a role="button" tabindex="0" aria-label="Toggle color theme"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></a></li></ul><ul class="hidden-links hidden"></ul>
</nav></div></div></div>
